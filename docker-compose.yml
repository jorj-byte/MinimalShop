services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minimalshop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d minimalshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=minimalshop;Username=shop;Password=${POSTGRES_PASSWORD:-shop123}
      Admin__Password: ${ADMIN_PASSWORD:-changeme}
      Admin__MaxFailedAttempts: "5"
      Admin__LockoutMinutes: "15"
      Shop__StoreName: ${SHOP_NAME:-MinimalShop}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
